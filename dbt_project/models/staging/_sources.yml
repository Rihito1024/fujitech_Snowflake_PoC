version: 2

sources:
  - name: salesforce
    description: >
      Salesforce由来のRawデータ
    database: "DATASOURCE"
    schema: "SALESFORCE"
    tables:
      # name は実テーブル名に合わせる（Openflow は引用符なし作成 = Snowflake 上は大文字）。
      # モデル側の source('salesforce', '<NAME>') も同じ大文字を使う。
      - name: ACCOUNT
        description: 顧客アカウント（Salesforce Account）
      - name: ASSET
        description: 資産（納入号機。Salesforce Asset）
      - name: BUILDING__C
        description: 建物マスタ（Salesforce カスタムオブジェクト Building__c）
      - name: DEPARTMENTMST__C
        description: 部門マスタ（Salesforce カスタムオブジェクト DepartmentMst__c）
      - name: OPPORTUNITY
        description: 商談（Salesforce Opportunity）
      - name: OPPORTUNITY_ASSET__C
        description: 商談-資産の関連（Salesforce カスタムオブジェクト Opportunity_Asset__c）
      - name: OPPORTUNITYBUILDING__C
        description: 商談-建物の関連（Salesforce カスタムオブジェクト OpportunityBuilding__c）
      - name: OPPORTUNITYLINEITEM
        description: 商談品目（Salesforce OpportunityLineItem）
      - name: PRODUCT2
        description: 商品マスタ（Salesforce Product2）
      - name: RECORDTYPE
        description: レコードタイプマスタ（Salesforce RecordType）
      - name: USER
        description: >
          ユーザーマスタ（Salesforce User）。"USER" はSnowflakeの予約語のため
          quoting.identifier を有効化して引用符付きで参照する。
        quoting:
          identifier: true
